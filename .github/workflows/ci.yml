name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: care_ops}
        ports: ["5433:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Unit tests (no DB needed)
        run: python -m pytest
      # Data download + load is local. The DB test skips when the views are absent.

  academy-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild the academy pages and diff
        run: |
          python -m pip install pyyaml==6.0.3 markdown==3.11.2
          python academy/scripts/build_site.py
          git diff --exit-code -- academy/site academy/content/QUIZ_ANSWERS.md
