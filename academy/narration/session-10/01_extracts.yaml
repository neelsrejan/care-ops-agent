title: Session 10 · Rows a dashboard can import
file: ../../../src/care_ops_agent/export/tableau.py
overview: tableau.py is the handoff to a dashboard tool this repo cannot log into.
  It flattens weekly rates, the pipeline, the PDSA log, and the burn into scalar columns.
  A hyper extract is created later inside Tableau from these CSVs. The local HTML
  preview is a different module and is not this file. Publishing remains a manual
  step.
voice: en-US-AndrewNeural
rate: +0%
