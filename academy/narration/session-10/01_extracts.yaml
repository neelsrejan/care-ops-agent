  say: The docstring draws the line. These files are extracts. They are not a published
    workbook and they do not call Tableau Public.
- lines: 19-48
  say: care_gap_weekly groups to the cell and uses the same rate helper as triage.
    The label column is SYNTHETIC on every row. Nested objects are not written, so
