[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "care-ops-agent"
version = "0.1.0"
description = "Simulated provider-network care-gap closure agent (patient outcomes). Synthetic data; not for clinical use."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Neel Srejan" }]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "pyyaml>=6",
  "pydantic>=2",
  "psycopg[binary]>=3.1",
  "openpyxl>=3.1",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
care_ops_agent = ["py.typed"]
